<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2ecdf" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lettre Minute</title>
    <!-- What WhatsApp, Messenger or Discord show under a shared link: crawlers run no script. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lettre Minute" />
    <meta property="og:title" content="Viens jouer à Lettre Minute" />
    <meta property="og:description" content="Une lettre, un thème, 60 secondes. Le Petit Bac express, entre amis." />
    <meta property="og:image" content="https://jfongue.github.io/lettre-minute/invite-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --paper: #f2ecdf;
        --paper-2: #e6ddca;
        --ink: #151515;
        --ink-faint: #8a8478;
        --red: #e0402a;
        --blue: #1f48c7;
        --yellow: #f4b41a;
        --green: #17614c;
        --pink: #f1a3b3;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Jost Variable', Futura, 'Century Gothic', system-ui, sans-serif;
      }
      main {
        max-width: 26rem;
        margin: 0 auto;
        padding: max(2.5rem, env(safe-area-inset-top)) 1.5rem 3rem;
        display: grid;
        gap: 1.75rem;
      }
      .poster {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        aspect-ratio: 5 / 1;
        overflow: hidden;
      }
      .tile {
        display: block;
        overflow: hidden;
        animation: pop-in 520ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        animation-delay: calc(var(--i) * 35ms);
      }
      .motion,
      .tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .motion-turn {
        animation: quarter-turns 12s cubic-bezier(0.7, 0, 0.2, 1) infinite;
        animation-delay: calc(var(--i) * -1.7s);
      }
      .motion-pulse {
        animation: breathe 5s ease-in-out infinite alternate;
        animation-delay: calc(var(--i) * -0.8s);
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
      }
      @keyframes quarter-turns {
        0%, 18% { transform: rotate(0deg); }
        25%, 43% { transform: rotate(90deg); }
        50%, 68% { transform: rotate(180deg); }
        75%, 93% { transform: rotate(270deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes breathe {
        to {
          transform: scale(0.8);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tile,
        .motion {
          animation: none;
        }
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .brand::before {
        content: '';
        width: 0.65rem;
        height: 0.65rem;
        background: var(--red);
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        line-height: 1.18;
        text-wrap: balance;
      }
      h1 span {
        color: var(--red);
      }
      .round {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.9rem;
        padding: 0.9rem 0;
        border-block: 2px solid var(--ink);
      }
      .letter {
        width: 2.75rem;
        height: 2.75rem;
        display: grid;
        place-items: center;
        background: var(--red);
        color: var(--paper);
        font-size: 1.75rem;
        font-weight: 800;
      }
      .round b {
        display: block;
        font-size: 1.05rem;
        font-weight: 800;
      }
      .round small {
        display: block;
        color: var(--ink-faint);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .round em {
        font-style: normal;
        color: var(--red);
      }
      .steps {
        display: grid;
        gap: 0.6rem;
        padding: 0;
        list-style: none;
        counter-reset: step;
      }
      .label {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      a.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        min-height: 3.25rem;
        padding: 0.8rem 1rem;
        border: 2px solid var(--ink);
        background: transparent;
        color: var(--ink);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        text-align: center;
      }
      a.btn--main {
        background: var(--ink);
        color: var(--paper);
      }
      .steps a.btn::before {
        counter-increment: step;
        content: counter(step);
        font-variant-numeric: tabular-nums;
        opacity: 0.55;
      }
      a.btn:focus-visible {
        outline: 3px solid #f4b41a;
        outline-offset: 3px;
      }
      .other {
        font-size: 0.8rem;
        color: var(--ink-faint);
        text-align: center;
      }
      .other a {
        color: var(--ink-faint);
        text-decoration-color: var(--paper-2);
        text-decoration-thickness: 2px;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main id="invite"></main>
    <script type="module" src="/src/invite.ts"></script>
  </body>
</html>
