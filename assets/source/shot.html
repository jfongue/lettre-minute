<!doctype html>
<!-- Capture légendée de la fiche Play Store (1080 × 1920), rendue par
     scripts/render-store.sh : ?lang=fr&n=1 à 8. La capture brute vient de
     store/android/screenshots/<lang>/ ; la légende, du tableau ci-dessous. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(jost.woff2); font-weight: 100 900; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    --paper: #f2ecdf; --ink: #151515; --frame: #151515;
    position: relative; background: var(--paper); color: var(--ink); font-family: Jost;
  }
  body.dark { --paper: #151515; --ink: #f2ecdf; --frame: #3a3833; }
  h1 {
    position: absolute; left: 84px; right: 84px; top: 118px; margin: 0;
    font-weight: 800; font-size: 86px; line-height: 0.98; letter-spacing: -0.02em; text-transform: uppercase;
    text-wrap: balance;
  }
  /* La marque de la lettre, à côté du titre et jamais dessous. */
  .dot { position: absolute; left: 84px; top: 64px; width: 30px; height: 30px; border-radius: 50%; background: #e0402a; }
  img {
    position: absolute; left: 110px; top: 470px; width: 860px;
    border: 8px solid var(--frame); border-radius: 44px; box-sizing: border-box;
  }
</style>
</head>
<body>
  <span class="dot"></span>
  <h1></h1>
  <img alt="" />
<script>
  // Dans l’ordre de la fiche : le jeu d’abord, l’accueil ensuite, le clair puis le sombre.
  const shots = ['3-partie', '4-bilan', '2-annonce', '1-accueil', '3-partie-sombre', '4-bilan-sombre', '2-annonce-sombre', '1-accueil-sombre']
  const captions = {
    fr: ['Chaque mot vérifié pendant la frappe', 'Plus le mot est rare, plus il rapporte', 'Cinq catégories, soixante secondes', 'Des niveaux et des catégories à débloquer',
      'Une faute de frappe ? Elle passe.', 'Enchaînez les mots, jusqu’à ×2', 'Thème clair ou sombre', 'Sans inscription, jouable hors ligne'],
    en: ['Every word checked as you type', 'The rarer the word, the more it scores', 'Five categories, sixty seconds', 'Level up and unlock new categories',
      'A typo? It still counts.', 'Chain your words, up to ×2', 'Light or dark theme', 'No sign-up, plays offline'],
    de: ['Jedes Wort wird beim Tippen geprüft', 'Je seltener das Wort, desto mehr Punkte', 'Fünf Kategorien, sechzig Sekunden', 'Steig auf und schalte Kategorien frei',
      'Ein Tippfehler? Zählt trotzdem.', 'Wörter am Stück: bis zu ×2', 'Helles oder dunkles Design', 'Ohne Anmeldung, auch offline'],
    es: ['Cada palabra, comprobada al escribir', 'Cuanto más rara la palabra, más puntos', 'Cinco categorías, sesenta segundos', 'Sube de nivel y desbloquea categorías',
      '¿Una errata? Vale igual.', 'Encadena palabras, hasta ×2', 'Tema claro u oscuro', 'Sin registro, también sin conexión'],
    it: ['Ogni parola verificata mentre scrivi', 'Più la parola è rara, più punti vale', 'Cinque categorie, sessanta secondi', 'Sali di livello e sblocca categorie',
      'Un errore di battitura? Vale lo stesso.', 'Parole a catena, fino a ×2', 'Tema chiaro o scuro', 'Senza registrazione, anche offline'],
    nl: ['Elk woord gecontroleerd terwijl je typt', 'Hoe zeldzamer het woord, hoe meer punten', 'Vijf categorieën, zestig seconden', 'Stijg in level en ontgrendel categorieën',
      'Een tikfout? Telt gewoon mee.', 'Woorden op rij: tot ×2', 'Licht of donker thema', 'Zonder account, ook offline'],
    pt: ['Cada palavra conferida enquanto você digita', 'Quanto mais rara a palavra, mais pontos', 'Cinco categorias, sessenta segundos', 'Suba de nível e desbloqueie categorias',
      'Errou uma letra? Vale mesmo assim.', 'Encadeie palavras, até ×2', 'Tema claro ou escuro', 'Sem cadastro, dá para jogar offline'],
  }
  const params = new URLSearchParams(location.search)
  const lang = params.get('lang') ?? 'fr'
  const index = Number(params.get('n') ?? 1) - 1
  const shot = shots[index]
  document.documentElement.lang = lang
  document.body.classList.toggle('dark', shot.endsWith('-sombre'))
  document.querySelector('h1').textContent = captions[lang][index]
  document.querySelector('img').src = `../../store/android/screenshots/${lang}/${shot}.png`
</script>
</body>
</html>
