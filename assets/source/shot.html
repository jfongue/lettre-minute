<!doctype html>
<!-- Capture légendée de la fiche Play Store (1080 × 1920), rendue par
     scripts/render-store.sh : ?lang=fr&n=1 à 6. La capture brute vient de
     store/android/screenshots/<lang>/ ; la légende, du tableau ci-dessous. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(jost.woff2); font-weight: 100 900; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    --paper: #f2ecdf; --ink: #151515; --frame: #151515;
    position: relative; background: var(--paper); color: var(--ink); font-family: Jost;
  }
  body.dark { --paper: #151515; --ink: #f2ecdf; --frame: #3a3833; }
  h1 {
    position: absolute; left: 84px; right: 84px; top: 118px; margin: 0;
    font-weight: 800; font-size: 86px; line-height: 0.98; letter-spacing: -0.02em; text-transform: uppercase;
    text-wrap: balance;
  }
  /* La marque de la lettre, à côté du titre et jamais dessous. */
  .dot { position: absolute; left: 84px; top: 64px; width: 30px; height: 30px; border-radius: 50%; background: #e0402a; }
  img {
    position: absolute; left: 110px; top: 470px; width: 860px;
    border: 8px solid var(--frame); border-radius: 44px; box-sizing: border-box;
  }
</style>
</head>
<body>
  <span class="dot"></span>
  <h1></h1>
  <img alt="" />
<script>
  // Dans l’ordre de la fiche, une capture par section de la description, légendée de son titre.
  const shots = ['1-accueil', '3-partie', '6-defi', '5-pouvoirs', '2-annonce', '4-bilan']
  const captions = {
    fr: ['Une lettre, un thème, 60 secondes', 'Trouve le plus de mots possible', 'Défie tes amis', 'Des pouvoirs pour tricher un peu', 'Plein de thèmes à découvrir', 'Maîtrise le jeu et deviens expert'],
    en: ['One letter, one category, 60 seconds', 'Find as many words as you can', 'Challenge your friends', 'Powers to cheat a little', 'Lots of categories to discover', 'Master the game and become an expert'],
    de: ['Ein Buchstabe, ein Thema, 60 Sekunden', 'Finde so viele Wörter wie möglich', 'Fordere deine Freunde heraus', 'Kräfte zum Schummeln', 'Jede Menge Themen zu entdecken', 'Meistere das Spiel und werde zum Profi'],
    es: ['Una letra, un tema, 60 segundos', 'Encuentra todas las palabras que puedas', 'Reta a tus amigos', 'Poderes para hacer un poco de trampa', 'Un montón de temas por descubrir', 'Domina el juego y conviértete en experto'],
    it: ['Una lettera, un tema, 60 secondi', 'Trova più parole che puoi', 'Sfida i tuoi amici', 'Poteri per barare un po’', 'Tanti temi da scoprire', 'Padroneggia il gioco e diventa un esperto'],
    nl: ['Eén letter, één thema, 60 seconden', 'Vind zoveel mogelijk woorden', 'Daag je vrienden uit', 'Krachten om een beetje vals te spelen', 'Heel veel thema’s om te ontdekken', 'Beheers het spel en word een expert'],
    pt: ['Uma letra, um tema, 60 segundos', 'Encontre o máximo de palavras', 'Desafie seus amigos', 'Poderes para trapacear um pouco', 'Muitos temas para descobrir', 'Domine o jogo e vire especialista'],
  }
  const params = new URLSearchParams(location.search)
  const lang = params.get('lang') ?? 'fr'
  const index = Number(params.get('n') ?? 1) - 1
  const shot = shots[index]
  document.documentElement.lang = lang
  document.body.classList.toggle('dark', shot.endsWith('-sombre'))
  const title = document.querySelector('h1')
  title.textContent = captions[lang][index]
  // Une légende longue rapetisse plutôt que de mordre sur la capture.
  document.fonts.ready.then(() => {
    for (let size = 86; title.offsetHeight > 280 && size > 56; size -= 4) title.style.fontSize = `${size - 4}px`
  })
  document.querySelector('img').src = `../../store/android/screenshots/${lang}/${shot}.png`
</script>
</body>
</html>
