<!doctype html>
<!-- The picture chat apps show under a shared invitation (public/invite-card.png, 1200 × 630), made of the
     game's own pictures (npm run render:invite first):
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --allow-file-access-from-files --screenshot=public/invite-card.png "file://$PWD/assets/source/invite-card.html" -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f2ecdf; padding: 60px 72px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 64px; }
  .header { height: 510px; display: block; }
  .prompt { width: 100%; display: block; }
</style>
</head>
<body>
  <img class="header" src="../../public/invite/header-fr.png" alt="">
  <img class="prompt" src="../../public/invite/prompt-fr.png" alt="">
</body>
</html>
