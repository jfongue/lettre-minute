<!doctype html>
<!-- Couverture de la page Buy Me a Coffee (2400 × 600) : le centre seul reste visible sur téléphone. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(jost.woff2); font-weight: 100 900; }
  html, body { margin: 0; width: 2400px; height: 600px; overflow: hidden; }
  body {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 56px;
    background: #f2ecdf; color: #151515; font-family: Jost;
  }
  iframe { width: 300px; height: 300px; border: 0; }
  h1 { display: grid; margin: 0; font-weight: 800; font-size: 120px; line-height: 0.84; letter-spacing: -0.04em; text-transform: uppercase; }
  h1 span:last-child { color: #e0402a; justify-self: end; }
  p { margin: 26px 0 0; font-weight: 600; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; }
  .phones { display: flex; gap: 28px; margin-left: 40px; }
  .phones img { width: 250px; height: 444px; object-fit: cover; object-position: top; border-radius: 26px; border: 6px solid #151515; background: #151515; }
  .phones img:nth-child(2) { transform: translateY(-24px); }
  .arch { position: absolute; right: -60px; bottom: -120px; width: 260px; height: 260px; border-radius: 50%; background: #1f48c7; }
  .quarter { position: absolute; left: 120px; top: 0; width: 110px; height: 110px; border-bottom-right-radius: 100%; background: #17614c; }
  .sun { position: absolute; left: 60px; bottom: -70px; width: 150px; height: 150px; border-radius: 50%; background: #f4b41a; }
</style>
</head>
<body>
  <iframe src="mark.html?layer=foreground&scale=1"></iframe>
  <div>
    <h1><span>Lettre</span><span>Minute</span></h1>
    <p>Une lettre · un thème · 60 secondes</p>
  </div>
  <div class="phones">
    <img src="../../store/android/screenshots/fr/2-annonce.png" />
    <img src="../../store/android/screenshots/fr/3-partie.png" />
    <img src="../../store/android/screenshots/fr/4-bilan-sombre.png" />
  </div>
  <span class="arch"></span>
  <span class="quarter"></span>
  <span class="sun"></span>
</body>
</html>
