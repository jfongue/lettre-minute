<!doctype html>
<!--
  Source de l'icône et de l'écran de lancement, rendue par
  scripts/render-assets.sh. Paramètres d'URL : layer (full | foreground |
  background), theme (light | dark), scale (taille du dessin, 1 = plein cadre).
  La lettre posée sur une forme, comme la lettre tirée en jeu.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(jost.woff2); font-weight: 100 900; }
  :root { --paper: #f2ecdf; --red: #e0402a; --yellow: #f4b41a; --blue: #1f48c7; --on-red: #f2ecdf; }
  :root.dark { --paper: #151515; --red: #f0553c; --yellow: #f7c230; --blue: #4468ec; --on-red: #151515; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body { display: grid; place-items: center; background: var(--paper); }
  body.foreground { background: transparent; }
  svg { width: calc(100vmin * var(--scale)); height: calc(100vmin * var(--scale)); overflow: visible; }
  text { font-family: Jost; font-weight: 800; fill: var(--on-red); }
</style>
</head>
<body>
<!-- Tout tient dans un cercle de rayon 46 : c'est ce que laisse le masque rond
     d'une icône adaptative Android. -->
<svg viewBox="0 0 100 100" aria-hidden="true">
  <g transform="translate(-3 0.5)">
  <circle cx="72" cy="28" r="14" fill="var(--yellow)" />
  <rect x="20" y="24" width="56" height="56" fill="var(--red)" />
  <rect x="20" y="80" width="56" height="5" fill="var(--blue)" />
  <text x="48" y="72.5" text-anchor="middle" font-size="58">L</text>
  </g>
</svg>
<script>
  const params = new URLSearchParams(location.search)
  const layer = params.get('layer') ?? 'full'
  document.documentElement.classList.toggle('dark', params.get('theme') === 'dark')
  document.body.className = layer
  document.documentElement.style.setProperty('--scale', params.get('scale') ?? '1')
  if (layer === 'background') document.querySelector('svg').remove()
</script>
</body>
</html>
