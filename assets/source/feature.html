<!doctype html>
<!-- Bannière de la fiche Play Store (1024 × 500), rendue par scripts/render-store.sh. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(jost.woff2); font-weight: 100 900; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; display: grid; grid-template-columns: 340px 1fr; align-items: center; gap: 36px;
    padding: 0 64px 0 48px; box-sizing: border-box; background: #f2ecdf; color: #151515; font-family: Jost;
  }
  iframe { width: 340px; height: 340px; border: 0; }
  h1 { display: grid; margin: 0; font-weight: 800; font-size: 118px; line-height: 0.84; letter-spacing: -0.04em; text-transform: uppercase; }
  h1 span:last-child { color: #e0402a; justify-self: end; }
  p { margin: 26px 0 0; font-weight: 600; font-size: 19px; letter-spacing: 0.2em; text-transform: uppercase; }
  /* Les formes que prend la lettre en jeu, en bordure. */
  .arch { position: absolute; right: -40px; bottom: -80px; width: 160px; height: 160px; border-radius: 50%; background: #1f48c7; }
  .quarter { position: absolute; right: 150px; top: 0; width: 70px; height: 70px; border-bottom-left-radius: 100%; background: #17614c; }
</style>
</head>
<body>
  <iframe src="mark.html?layer=foreground&scale=1.1"></iframe>
  <div>
    <h1><span>Lettre</span><span>Minute</span></h1>
    <p>Un mot · une lettre · 60 secondes</p>
  </div>
  <span class="arch"></span>
  <span class="quarter"></span>
</body>
</html>
