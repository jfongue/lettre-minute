<!doctype html>
<!--
  The CrazyGames covers, rendered by scripts/crazygames-shots.ts:
  ?format=landscape (1920 × 1080), portrait (800 × 1200), square (800 × 800).
  The portal allows the title alone as text, no border, no icon: the poster's
  shapes stand beside the title, never under it.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(../../assets/source/jost.woff2); font-weight: 100 900; }
  :root { --paper: #f2ecdf; --ink: #151515; --red: #e0402a; --blue: #1f48c7; --yellow: #f4b41a; --green: #17614c; --grid: rgba(21, 21, 21, 0.06); }
  html, body { margin: 0; overflow: hidden; }
  body {
    box-sizing: border-box; display: grid; align-items: center; justify-items: center;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    font-family: Jost; color: var(--ink);
  }
  h1 { display: grid; margin: 0; font-weight: 800; line-height: 0.84; letter-spacing: -0.04em; text-transform: uppercase; }
  h1 span:last-child { color: var(--red); justify-self: end; }

  /* The composition: a 3 × 3 poster of the shapes a letter takes in the game. */
  .poster { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .poster > i { display: block; position: relative; overflow: hidden; }
  .sq-red { background: var(--red); }
  .sq-blue { background: var(--blue); }
  .sq-ink { background: var(--ink); }
  .circle::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--yellow); }
  .quarter::after { content: ''; position: absolute; inset: 0; border-top-left-radius: 100%; background: var(--green); }
  .quarter-r::after { content: ''; position: absolute; inset: 0; border-bottom-right-radius: 100%; background: var(--blue); }
  .half::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; border-radius: 999px 999px 0 0; background: var(--red); }
  .tri::after { content: ''; position: absolute; inset: 0; clip-path: polygon(0 100%, 50% 0, 100% 100%); background: var(--ink); }
  .ring::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; border: solid var(--red); border-width: calc(var(--cell) * 0.12); }

  body[data-format='landscape'] { width: 1920px; height: 1080px; background-size: 40px 40px; grid-template-columns: 720px 1fr; padding: 0 150px 0 170px; gap: 110px; }
  body[data-format='landscape'] .poster { --cell: 240px; width: 720px; height: 720px; }
  body[data-format='landscape'] h1 { font-size: 206px; }

  body[data-format='portrait'] { width: 800px; height: 1200px; background-size: 32px 32px; grid-template-rows: 1fr auto; padding: 96px 64px 120px; gap: 72px; }
  body[data-format='portrait'] .poster { --cell: 200px; width: 600px; height: 600px; }
  body[data-format='portrait'] h1 { font-size: 170px; }

  body[data-format='square'] { width: 800px; height: 800px; background-size: 32px 32px; grid-template-rows: 1fr auto; padding: 72px 64px 96px; gap: 48px; }
  body[data-format='square'] .poster { --cell: 120px; width: 360px; height: 360px; }
  body[data-format='square'] h1 { font-size: 132px; }
</style>
</head>
<body>
  <div class="poster" aria-hidden="true">
    <i class="sq-red"></i><i class="circle"></i><i class="quarter-r"></i>
    <i class="tri"></i><i class="sq-blue"></i><i class="half"></i>
    <i class="quarter"></i><i class="ring"></i><i class="sq-ink"></i>
  </div>
  <h1><span>Letter</span><span>Minute</span></h1>
<script>
  document.body.dataset.format = new URLSearchParams(location.search).get('format') ?? 'landscape'
</script>
</body>
</html>
