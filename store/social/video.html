<!doctype html>
<!--
  The social video, as a HyperFrames composition. render-videos.ts fills the
  {{…}} slots for each language and format — story 1080 × 1920 (TikTok, Reels,
  Shorts), feed 1080 × 1350, square 1080 × 1080, landscape 1920 × 1080 — with
  the cuts read from the language's capture (marks.json) and its words from
  copy.js. A title card opens it and an end card closes it; the captions stand
  beside the game, never on a shape. In the story, the top band is free for the
  captions and the game sits below, clear of the apps' own buttons at the top.
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Jost; src: url(../media/jost.woff2); font-weight: 100 900; }
  :root { --paper: #f2ecdf; --ink: #151515; --red: #e0402a; --grid: rgba(21, 21, 21, 0.06); }
  html, body { margin: 0; background: var(--paper); }
  #root {
    position: relative; overflow: hidden; width: {{W}}px; height: {{H}}px; font-family: Jost; color: var(--ink);
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .card {
    position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.5em; background: var(--paper); text-align: center; font-size: var(--card, 40px);
  }
  .card img { width: 5.2em; height: 5.2em; border-radius: 1.1em; }
  .card h1 { display: grid; margin: 0.3em 0 0; font-weight: 800; font-size: 3.2em; line-height: 0.84; letter-spacing: -0.04em; text-transform: uppercase; }
  .card h1 span:last-child { color: var(--red); }
  .card p { margin: 0.4em 1.2em 0; font-weight: 600; font-size: 0.9em; letter-spacing: 0.16em; text-transform: uppercase; text-wrap: balance; }
  .card p span { white-space: nowrap; }
  .card .cta { margin-top: 0.9em; padding: 0.45em 1em; border: 0.12em solid var(--ink); font-weight: 800; font-size: 1em; letter-spacing: 0.08em; }
  .game { position: absolute; z-index: 1; box-shadow: 0 0 0 3px var(--ink); background: var(--paper); object-fit: cover; }
  .caption { position: absolute; z-index: 2; margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 0.98; text-transform: uppercase; }
  .caption em { font-style: normal; color: var(--red); }

  [data-format='story'] { --card: 46px; }
  [data-format='story'] .game { left: 162px; top: 540px; width: 756px; height: 1344px; }
  [data-format='story'] .caption { left: 70px; right: 70px; top: 330px; text-align: center; font-size: 74px; }

  [data-format='feed'] { --card: 38px; }
  [data-format='feed'] .game { left: 64px; top: 105px; width: 641px; height: 1140px; }
  [data-format='feed'] .caption { left: 745px; right: 40px; top: 50%; font-size: 50px; }

  [data-format='square'] { --card: 34px; }
  [data-format='square'] .game { left: 64px; top: 64px; width: 535px; height: 952px; }
  [data-format='square'] .caption { left: 640px; right: 40px; top: 50%; font-size: 52px; }

  [data-format='landscape'] { --card: 44px; }
  [data-format='landscape'] .game { left: 290px; top: 60px; width: 540px; height: 960px; }
  [data-format='landscape'] .caption { left: 960px; width: 860px; top: 50%; font-size: 96px; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-format="{{FORMAT}}" data-fps="30" data-start="0" data-duration="{{TOTAL}}">
  <div id="card-in" class="clip card" data-start="0" data-duration="{{IN_END}}">
    <img src="../media/icon.png" alt="" />
    <h1><span>{{NAME1}}</span><span>{{NAME2}}</span></h1>
    <p>{{HOOK}}</p>
  </div>

  <video id="run" class="clip game" src="../media/{{LANG}}/gameplay.mp4" muted playsinline
    data-start="{{RUN_AT}}" data-duration="{{RUN_DUR}}" data-media-start="{{RUN_FROM}}"></video>
  <video id="summary" class="clip game" src="../media/{{LANG}}/gameplay.mp4" muted playsinline
    data-start="{{SUM_AT}}" data-duration="{{SUM_DUR}}" data-media-start="{{SUM_FROM}}"></video>

  <p id="c1" class="clip caption" data-start="{{C1}}" data-duration="{{C1_DUR}}">{{V1}}</p>
  <p id="c2" class="clip caption" data-start="{{C2}}" data-duration="{{C2_DUR}}">{{V2}}</p>
  <p id="c3" class="clip caption" data-start="{{C3}}" data-duration="{{C3_DUR}}">{{V3}}</p>
  <p id="c4" class="clip caption" data-start="{{C4}}" data-duration="{{C4_DUR}}">{{V4}}</p>

  <div id="card-out" class="clip card" data-start="{{OUT_AT}}" data-duration="{{OUT_DUR}}">
    <img src="../media/icon.png" alt="" />
    <h1><span>{{NAME1}}</span><span>{{NAME2}}</span></h1>
    <p>{{TAGLINE}}</p>
    <span class="cta">{{CTA}}</span>
  </div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const T = {{TIMES}}
  const tl = gsap.timeline({ paused: true })
  const format = document.getElementById('root').dataset.format
  // Centred on their own height through GSAP, which owns the captions' transform.
  if (format !== 'story') tl.set('.caption', { yPercent: -50 }, 0)
  tl.from('#card-in img', { scale: 0.6, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, 0.05)
  tl.from('#card-in h1 span', { y: 60, opacity: 0, duration: 0.45, stagger: 0.12, ease: 'power3.out' }, 0.2)
  tl.from('#card-in p', { opacity: 0, duration: 0.4 }, 0.55)
  tl.to('#card-in', { opacity: 0, duration: 0.35, ease: 'power1.inOut' }, T.RUN_AT)
  for (const id of ['c1', 'c2', 'c3', 'c4']) {
    const at = T[id.toUpperCase()]
    tl.from('#' + id, format === 'story' ? { opacity: 0, y: 30, duration: 0.4, ease: 'power3.out' } : { opacity: 0, x: 40, duration: 0.45, ease: 'power3.out' }, at)
    tl.to('#' + id, { opacity: 0, duration: 0.3, ease: 'power1.in' }, at + T[id.toUpperCase() + '_DUR'] - 0.3)
  }
  tl.from('#card-out', { opacity: 0, duration: 0.4, ease: 'power1.inOut' }, T.OUT_AT)
  tl.from('#card-out .cta', { scale: 0.8, opacity: 0, duration: 0.4, ease: 'back.out(2)' }, T.OUT_AT + 0.5)
  window.__timelines = window.__timelines || {}
  window.__timelines.root = tl
</script>
</body>
</html>
